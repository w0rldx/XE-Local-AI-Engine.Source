name: windows-tests

# ADVISORY Windows test job. Every other CI test job runs on ubuntu-latest, so the tests that only mean
# something on Windows (Job Object tree-kill, WASAPI process loopback, named pipes, the Windows launcher,
# the Desktop shell, Windows path and disk probes) report skipped everywhere else. This job runs them, plus
# all of XE-Local-AI-Engine.Client.Persistence.Tests, on a real Windows runner.
#
# Deliberately a separate file and NOT part of build-and-test.yml: release.yml and dev-build.yml call
# build-and-test.yml as their validation gate, and this job must not gate a release. Nothing `needs` it and
# it is not a required status check.
#
# The bash gate scripts (run-backend-tests.sh, run-tests-memory-safe.sh, with-build-lock.sh) are Linux-bound
# (flock, /proc, process groups), so this job builds the two test projects in Release and runs their native
# TUnit test hosts directly. `dotnet test` is not used: it reports zero tests for TUnit in this repo.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Advisory, so a newer push to the same ref simply replaces the older run, develop included.
concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The Linux legs set TZ=Europe/Berlin to expose non-UTC time-zone bugs. .NET ignores TZ on Windows, so
      # the same zone is set on the (ephemeral) runner itself.
      - name: Set a non-UTC time zone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          tzutil /s "W. Europe Standard Time"
          if ($LASTEXITCODE -ne 0) { throw "tzutil exited $LASTEXITCODE" }
          tzutil /g
          if ($LASTEXITCODE -ne 0) { throw "tzutil exited $LASTEXITCODE" }

      # Only what the job runs: each test project pulls in the product projects it references.
      - name: Build the test projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in 'XE-Local-AI-Engine.Tests', 'XE-Local-AI-Engine.Client.Persistence.Tests') {
            dotnet build "$project/$project.csproj" --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "dotnet build $project exited $LASTEXITCODE" }
          }

      # Zero tests is never a pass. Each host fails the job when it exits non-zero (8 = the filter matched
      # nothing), writes no TRX report, executes nothing, or when a class named in its filter is absent from
      # the report (one mistyped alternative would otherwise vanish while the rest still match). A test
      # skipped for a not-Windows reason means a Windows gate did not engage on this runner, which is the
      # one thing this job exists to prove, so that fails it too. Counts come from the
      # TRX report the host writes; every skip is listed with its reason in the step summary.
      # ManagedPythonWindowsLiveTests is left out: it is opt-in (XE_COMPUTE_LIVE=1) and downloads uv, a
      # CPython and a wheel. Width 2 is the width the Linux siblings leg is measured green at.
      - name: Run the Windows test hosts
        shell: pwsh
        env:
          RESULTS_ROOT: ${{ runner.temp }}/windows-test-results
          TEST_WIDTH: "2"
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsClasses = @(
            # Carry [RunOn(OS.Windows)] or a Windows-only runtime skip.
            'WindowsJobObjectTreeKillTests', 'WindowsProcessLoopbackTests', 'TranscriptionUploadSlotTests',
            'PlatformSkipTests', 'WorkspaceFileScannerWindowsTests', 'WhisperSourceRuntimeFoundationTests',
            'DriveInfoFreeSpaceProbeTests', 'HardwareProbeEnvironmentTests', 'TranscriptionSourceBuildEndpointTests',
            'DockerNamedPipePreflightTests',
            # Exercise Windows-only product types or branches.
            'ProcessAudioCaptureTests', 'ProviderLauncherSharedHandleTests', 'PathContainmentTests',
            'SecureFilePermissionsTests', 'DockerDaemonEndpointResolverTests', 'SingleInstanceLeaseTests',
            'WindowsLauncherApplicationTests', 'FrameworkDependentVelopackBootstrapTests', 'DesktopLifecycleTests',
            'DesktopParentLifetimeTests', 'DesktopPortStoreTests'
          )
          # Skip reasons that mean "this host is not Windows": TUnit's [RunOn(OS.Windows)] message, the named-pipe
          # preflight's runtime skip and JunctionSupport's probe. Any of them on this runner is a failure.
          $windowsOnlySkip = 'restricted to run on .*Windows|runs only on Windows|does not permit creating NTFS junctions'
          # Exe is the project's AssemblyName, which is not always the project name.
          $testHosts = @(
            @{ Name = 'XE-Local-AI-Engine.Tests'; Exe = 'XE-Local-AI-Engine.Tests'; Classes = $windowsClasses },
            @{ Name = 'XE-Local-AI-Engine.Client.Persistence.Tests'; Exe = 'XE_Local_AI_Engine.Client.Persistence.Tests'; Classes = @() }
          )
          $failures = @()
          $summary = @('## Windows test hosts', '', '| Host | Exit | Total | Executed | Passed | Failed | Skipped |', '| --- | --- | --- | --- | --- | --- | --- |')
          $skipDetails = @()

          foreach ($testHost in $testHosts) {
            $name = $testHost.Name
            $resultsDir = Join-Path $env:RESULTS_ROOT $name
            $hostArgs = @('--maximum-parallel-tests', $env:TEST_WIDTH, '--report-trx', '--report-trx-filename', "$name.trx", '--results-directory', $resultsDir)
            if ($testHost.Classes.Count -gt 0) {
              $hostArgs += @('--treenode-filter', "/*/*/($($testHost.Classes -join '|'))/*")
            }

            Write-Host "::group::$name"
            & "$name/bin/Release/net10.0/$($testHost.Exe).exe" @hostArgs
            $exitCode = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($exitCode -eq 8) { $failures += "${name}: the host exited 8, its filter matched no test" }
            elseif ($exitCode -ne 0) { $failures += "${name}: the host exited $exitCode" }

            $trxPath = Join-Path $resultsDir "$name.trx"
            if (-not (Test-Path -LiteralPath $trxPath)) {
              $failures += "${name}: no TRX report at $trxPath"
              $summary += "| $name | $exitCode | - | - | - | - | - |"
              continue
            }
            [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
            $counters = $trx.TestRun.ResultSummary.Counters
            $line = "| $name | $exitCode | $($counters.total) | $($counters.executed) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |"
            Write-Host "$name total=$($counters.total) executed=$($counters.executed) passed=$($counters.passed) failed=$($counters.failed) skipped=$($counters.notExecuted)"
            $summary += $line
            if ([int]$counters.executed -eq 0) { $failures += "${name}: zero tests executed" }

            $classById = @{}
            foreach ($unitTest in $trx.TestRun.TestDefinitions.UnitTest) {
              $classById[$unitTest.id] = $unitTest.TestMethod.className
            }
            foreach ($class in $testHost.Classes) {
              if (-not ($classById.Values | Where-Object { $_ -like "*.$class" })) {
                $failures += "${name}: filter class $class matched no test"
              }
            }
            foreach ($result in $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'NotExecuted' }) {
              $reason = "$($result.Output.DebugTrace)".Trim()
              $testName = "$($classById[$result.testId]).$($result.testName)"
              $skipDetails += "- ``$testName``: $reason"
              if ($reason -match $windowsOnlySkip) {
                $failures += "${name}: $testName was skipped as Windows-only on Windows"
              }
            }
          }

          if ($skipDetails.Count -gt 0) {
            $summary += @('', "<details><summary>Skipped tests ($($skipDetails.Count))</summary>", '') + $skipDetails + @('', '</details>')
          }
          if ($failures.Count -gt 0) {
            $summary += @('', '### Failures') + ($failures | ForEach-Object { "- $_" })
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $skipDetails | ForEach-Object { Write-Host "skipped $_" }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: ${{ runner.temp }}/windows-test-results/**/*.trx
          if-no-files-found: warn
          overwrite: true
