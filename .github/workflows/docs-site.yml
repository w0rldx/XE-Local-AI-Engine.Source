name: docs-site

# Builds the docs website in website/ from the Markdown in docs/, and publishes it to GitHub Pages.
# A PR builds only; a push to develop or a manual dispatch on develop builds and deploys. Not a
# required check: build-and-test stays the merge gate. Described in docs/wiki/reference/13-docs-site.md.
#
# The path filter is docs/** rather than the published folders: the published set has one home
# (website/src/lib/scope.mjs), and a second copy here could drift from it.
on:
  pull_request:
    branches: [develop]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only runs that can deploy (push or dispatch on develop) share the publish group, which runs them one at a time and
# never cancels a running one; a newer queued publish replaces an older queued one. A publish builds the head of
# develop as it is when the run starts, so a replaced, slow or fully re-run publish never loses or overwrites newer
# docs. Every other run (PRs, dispatches on other branches) is superseded by the next run on its ref.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && 'docs-site-pages' || format('docs-site-{0}', github.ref) }}
  cancel-in-progress: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop') }}

jobs:
  # Runs all dependency code (install, tests, build) with the read-only token; only the deploy job below can publish.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      attempt: ${{ github.run_attempt }}
      stamp: ${{ steps.commit.outputs.stamp }}
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a publish builds the current head of develop, not the triggering commit; other runs use the default ref
          ref: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && 'develop' || '' }}

      # A re-run or queued run uses the workflow file of its own commit but builds the current head; if the workflow
      # changed in between, its checks and pins would not be the ones the head expects.
      - name: Check this workflow is the one at the built commit
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          file=.github/workflows/docs-site.yml
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          if [ "$(git rev-parse "$WORKFLOW_SHA:$file")" != "$(git rev-parse "HEAD:$file")" ]; then
            echo "::error::$file changed since this run's workflow ($WORKFLOW_SHA); run workflow_dispatch on develop instead"
            exit 1
          fi

      - name: Show the built commit
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "::notice::building $sha"
          # commit plus run and attempt: unique per deployment, even when two deployments build the same commit
          echo "stamp=$sha-${{ github.run_id }}-${{ github.run_attempt }}" >>"$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # pnpm version is pinned via `packageManager` in website/, not the (absent) repo-root package.json.
          package_json_file: website/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The whole tree, not --prod: every package is build input. GitHub's alerts do not read pnpm 12
      # lockfiles, so this is the only advisory check the site gets.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Unit tests
        run: pnpm run test

      - name: License check
        run: pnpm run licenses:check

      - name: Build site
        run: pnpm run build

      - name: Verify build output
        run: pnpm run verify:build

      # lets the deploy job confirm readers get this build, not a cached older one
      - name: Stamp the build
        run: echo "${{ steps.commit.outputs.stamp }}" >build/version.txt

      # Named per attempt: a re-run never leaves two same-named artifacts, and a deploy-only retry finds none.
      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: website/build

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      # Re-running only this job would deploy what an earlier attempt built, possibly over newer docs published since.
      - name: Check the artifact was built in this attempt
        env:
          BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$BUILD_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error::the site was built in attempt $BUILD_ATTEMPT, this is attempt $RUN_ATTEMPT; re-run all jobs or run workflow_dispatch on develop"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Smoke-test the published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          STAMP: ${{ needs.build.outputs.stamp }}
        run: |
          base="${PAGE_URL%/}"
          # Pages and its CDN can serve the previous build for a while: wait until this deployment's stamp is live,
          # with a fresh query per poll so a stale first answer cannot be cached for the later ones
          for poll in $(seq 30); do
            live="$(curl -fsSL "$base/version.txt?$STAMP-$poll" 2>/dev/null || true)"
            [ "$live" = "$STAMP" ] && break
            sleep 10
          done
          if [ "$live" != "$STAMP" ]; then
            echo "::error::the site still serves ${live:-nothing} after 5 minutes, expected $STAMP"
            exit 1
          fi
          for path in "/" "/docs/wiki/Home" "/third-party-notices"; do
            # the query keeps a page's cached response from an earlier deploy from answering for this one
            code="$(curl -sSL --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null -w '%{http_code}' "$base$path?$STAMP")"
            [ "$code" = 200 ] || { echo "::error::$base$path returned $code"; exit 1; }
            echo "ok $base$path"
          done
