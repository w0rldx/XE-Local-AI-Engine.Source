name: e2e

# Non-blocking E2E suite. It is NOT a PR merge gate: it builds the SPA in-fixture and needs
# Playwright browsers, so it runs on manual dispatch, or on a PR to develop opted in with the
# `run-e2e` label. The job-level guard skips it for any other pull_request event.
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    types: [labeled]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-e2e'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      # Same key recipe as build-and-test.yml: no packages.lock.json in this repo, so the key hashes
      # the version manifest plus every project file — the two things that decide what restore pulls.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Browser binaries are ~400 MB and pinned by the Microsoft.Playwright version, which lives in
      # Directory.Packages.props — hashing that file is the same key style as the NuGet cache above and
      # invalidates whenever the pin moves. `playwright install --with-deps` still runs below: the OS
      # package half is not cacheable, and the browser half is a no-op on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Build E2E project
        run: dotnet build XE-Local-AI-Engine.Tests.E2ETests/XE-Local-AI-Engine.Tests.E2ETests.csproj -p:RunE2ETests=true --configuration Release

      - name: Install Playwright browsers
        run: pwsh XE-Local-AI-Engine.Tests.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run E2E tests
        env:
          TZ: Europe/Berlin
        run: dotnet test XE-Local-AI-Engine.Tests.E2ETests/XE-Local-AI-Engine.Tests.E2ETests.csproj --configuration Release --no-build -p:RunE2ETests=true

      # The fixture writes a trace .zip per failing test to a relative `test-results/traces/` dir
      # (XEE2ETestBase.StopTracingAsync); the glob catches it whether the test host CWD is the project
      # root or the bin output dir. if-no-files-found: ignore => an all-green run uploads nothing.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: XE-Local-AI-Engine.Tests.E2ETests/**/test-results/traces/**
          if-no-files-found: ignore
