name: build-and-test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore XE-Local-AI-Engine.slnx

      - name: Build solution
        run: dotnet build XE-Local-AI-Engine.slnx --configuration Release --no-restore

      - name: Run client persistence tests (fences included)
        run: dotnet test --project XE-Local-AI-Engine.Client.Persistence.Tests/XE-Local-AI-Engine.Client.Persistence.Tests.csproj --configuration Release --no-build

      - name: Run worker node tests
        run: dotnet test --project XE-Local-AI-Engine.Tests/XE-Local-AI-Engine.Tests.csproj --configuration Release --no-build

  client-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XE-Local-AI-Engine.Client.React

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift gate: regenerate the hey-api client from the committed OpenAPI spec and fail if the
      # generated output differs from what is committed. Deterministic; needs no running host.
      - name: Check generated OpenAPI client is up to date
        run: pnpm run openapi:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
