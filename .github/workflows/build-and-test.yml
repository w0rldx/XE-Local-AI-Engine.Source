name: build-and-test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore XE-Local-AI-Engine.slnx

      - name: Build solution
        run: dotnet build XE-Local-AI-Engine.slnx --configuration Release --no-restore

      # Auto-enrolling backend test run: `dotnet test` on the solution runs EVERY MTP test project
      # (name ends with .Tests / contains .Tests.) so new suites need no workflow edit. E2E is excluded
      # by default (its csproj sets IsTestingPlatformApplication=false unless RunE2ETests=true, so the
      # MTP runner does not collect it); it needs Playwright browsers + builds the SPA, so it runs in the
      # dedicated e2e workflow. --max-parallel-test-modules 1 keeps suites sequential (concurrent runs
      # time out on shared runners). TZ=Europe/Berlin exposes non-UTC time-zone bugs (e.g.
      # CapabilityReporterTests). global.json pins the Microsoft.Testing.Platform runner for dotnet test.
      - name: Run backend tests (auto-enrolled)
        env:
          TZ: Europe/Berlin
        run: |
          set -o pipefail
          dotnet test XE-Local-AI-Engine.slnx --configuration Release --no-build --max-parallel-test-modules 1 \
            | tee /tmp/xe-test-output.txt
          # Hollow-gate guard: MTP always emits a "Passed!" or "Failed!" summary per suite that ran.
          # If zero suites are enrolled (e.g. misnamed project, MTP not collected), the output has
          # no summary line and dotnet exits 0 — this check catches that silent green.
          if ! grep -qE 'Passed!|Failed!' /tmp/xe-test-output.txt; then
            echo "ERROR: no test-suite summary found — zero test projects enrolled." \
                 "Check project names or IsTestingPlatformApplication." >&2
            exit 1
          fi

  client-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XE-Local-AI-Engine.Client.React

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift gate: regenerate the hey-api client from the committed OpenAPI spec and fail if the
      # generated output differs from what is committed. Deterministic; needs no running host.
      - name: Check generated OpenAPI client is up to date
        run: pnpm run openapi:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage:check

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        # high/critical block the build; moderate/low are advisory-only and must not red an unrelated PR.
        run: pnpm audit --prod --audit-level=high
