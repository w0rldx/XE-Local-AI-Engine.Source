name: build-and-test

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  # Reusable entrypoint: the release workflow calls this file so the exact
  # tagged commit re-runs these gates before any package is published. No
  # inputs/secrets are needed — every job here is self-contained and only
  # reads the repo (permissions: contents: read), so the caller need not
  # pass `secrets: inherit`.
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    # Two dotnet builds of the AI.Agent.Tests project (the P0_SPIKE gate) dominate this job.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore pinned release tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Run auto-enrolled release contract tests
        run: scripts/run-release-contract-tests.sh

      # Static analysis of the release-critical shell/PowerShell scripts, the Pester suites, and the
      # P0_SPIKE compile gate. ubuntu-latest already ships shellcheck, pwsh, PSScriptAnalyzer and
      # Pester; --bootstrap only installs PSScriptAnalyzer if a future image drops it (a missing
      # linter is exit 2 here, never a silent pass). --no-behavior skips the contract-test pass the
      # step above already ran.
      - name: Lint release-critical scripts
        run: scripts/lint-release-scripts.sh --no-behavior --bootstrap

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # No packages.lock.json in this repo, so the key hashes the version manifest plus every
      # project file — the two things that decide what restore pulls. actions/setup-dotnet's own
      # `cache` input is not usable here: it requires lock files.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore XE-Local-AI-Engine.slnx

      - name: Build solution
        run: dotnet build XE-Local-AI-Engine.slnx --configuration Release --no-restore

      - name: Setup pnpm for live OpenAPI verification
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js for live OpenAPI verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Install frontend dependencies for live OpenAPI verification
        working-directory: XE-Local-AI-Engine.Client.React
        run: pnpm install --frozen-lockfile

      - name: Compare live backend OpenAPI with committed frontend contract
        run: scripts/openapi-live-check.sh

      # Auto-enrolling backend test run: the project list is read from the solution file, so a new
      # test suite is picked up without editing this workflow. E2E is excluded here (it needs
      # Playwright browsers + builds the SPA, so it runs in the dedicated e2e workflow).
      #
      # One `dotnet test` per project rather than one over the solution, because MTP resolves
      # --coverage-output relative to --results-directory: a single shared directory would let
      # parallel modules overwrite each other's Cobertura report. Each project therefore gets its
      # own results directory, and every report is merged afterwards. The trade is the old
      # --max-parallel-test-modules 2 overlap: modules now run one after another.
      #
      # --maximum-parallel-tests caps the width (TUnit's default is ProcessorCount*4, which times
      # out on shared runners). TZ=Europe/Berlin exposes non-UTC time-zone bugs (e.g.
      # CapabilityReporterTests). global.json pins the Microsoft.Testing.Platform runner.
      - name: Run backend tests with coverage (auto-enrolled)
        env:
          TZ: Europe/Berlin
          COVERAGE_ROOT: ${{ runner.temp }}/backend-coverage
        run: |
          set -euo pipefail
          mapfile -t test_projects < <(
            grep -oE 'Project Path="[^"]*"' XE-Local-AI-Engine.slnx \
              | sed -E 's/Project Path="([^"]*)"/\1/' \
              | grep -E '\.Tests(\.[A-Za-z0-9]+)*\.csproj$' \
              | grep -v 'E2ETests' \
              | sort)
          if [[ "${#test_projects[@]}" -eq 0 ]]; then
            echo "ERROR: zero test projects discovered in XE-Local-AI-Engine.slnx." >&2
            exit 1
          fi
          printf 'Enrolled test project: %s\n' "${test_projects[@]}"

          for project in "${test_projects[@]}"; do
            module="$(basename "$project" .csproj)"
            dotnet test "$project" --configuration Release --no-build \
              --maximum-parallel-tests 8 \
              --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura \
              --report-trx \
              --results-directory "$COVERAGE_ROOT/$module" \
              | tee "$COVERAGE_ROOT-$module.log"
            # Hollow-gate guard: MTP always emits a "Passed!" or "Failed!" summary per suite that
            # ran. A suite that enrolled nothing prints no summary and still exits 0 — this catches
            # that silent green.
            if ! grep -qE 'Passed!|Failed!' "$COVERAGE_ROOT-$module.log"; then
              echo "ERROR: $module produced no test-suite summary — nothing ran." \
                   "Check project names or IsTestingPlatformApplication." >&2
              exit 1
            fi
          done

          mapfile -t reports < <(find "$COVERAGE_ROOT" -type f -name 'coverage.cobertura.xml' | sort)
          if [[ "${#reports[@]}" -ne "${#test_projects[@]}" ]]; then
            echo "ERROR: expected ${#test_projects[@]} Cobertura reports, found ${#reports[@]}." >&2
            exit 1
          fi
          python3 scripts/merge-cobertura.py \
            --minimum-file scripts/backend-coverage-baseline.txt \
            "${reports[@]}"

      - name: Upload backend coverage and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: |
            ${{ runner.temp }}/backend-coverage/**/*.xml
            ${{ runner.temp }}/backend-coverage/**/*.trx
          # warn, not error: a run that died before the first suite finished has nothing to upload,
          # and the test step already failed — a second red here would only add noise.
          if-no-files-found: warn

  client-react:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: XE-Local-AI-Engine.Client.React

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Setup .NET 8 runtime for pinned license tooling
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore pinned .NET license tools
        run: dotnet tool restore --tool-manifest ../dotnet-tools.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift gate: regenerate the hey-api client from the committed OpenAPI spec and fail if the
      # generated output differs from what is committed. Deterministic; needs no running host.
      - name: Check generated OpenAPI client is up to date
        run: pnpm run openapi:check

      # License-drift gate: fail the build if a production dependency's license is not on
      # the allowlist, or if the committed license manifest is stale. Same deterministic, host-free
      # pattern as the OpenAPI drift gate above. `pnpm run licenses:check` (not `pnpm licenses`,
      # which is the built-in report command) so the repo script is what runs.
      - name: Check dependency licenses
        run: pnpm run licenses:check

      # `validate` is a superset of `lint`: tsc --noEmit + biome + stylelint, then the knip
      # dead-code baseline, the SignalR proxy/hub-registration sync check (reads Program.cs from
      # this checkout — no running backend) and the dependency-cruiser baseline. All static.
      # `pnpm run spellCheck` is deliberately NOT here: it reports ~1.7k unknown words on the
      # current tree, so it is a dictionary task, not a gate.
      - name: Validate (lint, knip, SignalR proxy sync, dependency baseline)
        run: pnpm run validate

      - name: Test
        run: pnpm run test:coverage:check

      - name: Test build and compliance tooling
        run: pnpm run test:tooling

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        # high/critical block the build; moderate/low are advisory-only and must not red an unrelated PR.
        run: pnpm audit --prod --audit-level=high
