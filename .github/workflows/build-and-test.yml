name: build-and-test

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  # Reusable entrypoint: the release workflow calls this file so the exact
  # tagged commit re-runs these gates before any package is published. No
  # inputs/secrets are needed — every job here is self-contained and only
  # reads the repo (permissions: contents: read), so the caller need not
  # pass `secrets: inherit`.
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Repo Python quality gate (ruff / pyrefly / pytest / bandit) over tools/training and scripts/**,
  # driven by the root pyproject.toml + uv.lock (dev tooling only — the training runtime manifest
  # under tools/training is a separate, shipped lockfile and is not synced here). Local equivalent:
  # scripts/python-validation.sh --scope full. See AGENTS.md.
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.30"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python quality gate
        run: scripts/python-validation.sh --scope full --serial

      - name: Docs inventory guard
        run: python3 scripts/docs-inventory-check.py

  release-contracts:
    runs-on: ubuntu-latest
    # Two dotnet builds of the AI.Agent.Tests project (the P0_SPIKE gate) dominate this job.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore pinned release tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Run auto-enrolled release contract tests
        run: scripts/run-release-contract-tests.sh

      # ubuntu-latest ships shellcheck 0.9.0, whose SC2317/SC2015 false positives (fixed in 0.10)
      # fail the --severity=style pass on scripts that are clean under the 0.11.0 mise resolves
      # locally. Pin the exact release the scripts are validated against, sha256-verified, so the
      # gate does not drift with the runner image. lint-release-scripts.sh refuses (exit 2) anything
      # older than 0.10.0, so a broken install here is loud rather than a wall of stale findings.
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl -sSfL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # Static analysis of the release-critical shell/PowerShell scripts, the Pester suites, and the
      # P0_SPIKE compile gate. shellcheck comes from the pinned step above; ubuntu-latest already
      # ships pwsh, PSScriptAnalyzer and Pester; --bootstrap only installs PSScriptAnalyzer if a
      # future image drops it (a missing linter is exit 2 here, never a silent pass). --no-behavior
      # skips the contract-test pass the step above already ran.
      - name: Lint release-critical scripts
        run: scripts/lint-release-scripts.sh --no-behavior --bootstrap

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # No packages.lock.json in this repo, so the key hashes the version manifest plus every
      # project file — the two things that decide what restore pulls. actions/setup-dotnet's own
      # `cache` input is not usable here: it requires lock files.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore XE-Local-AI-Engine.slnx

      - name: Build solution
        run: dotnet build XE-Local-AI-Engine.slnx --configuration Release --no-restore

      - name: Setup pnpm for live OpenAPI verification
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js for live OpenAPI verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Install frontend dependencies for live OpenAPI verification
        working-directory: XE-Local-AI-Engine.Client.React
        run: pnpm install --frozen-lockfile

      - name: Compare live backend OpenAPI with committed frontend contract
        run: scripts/openapi-live-check.sh

      # Auto-enrolling backend test run: the project list is read from the solution file, so a new
      # test suite is picked up without editing this workflow. E2E is excluded here (it needs
      # Playwright browsers + builds the SPA, so it runs in the dedicated e2e workflow).
      #
      # One `dotnet test` per project rather than one over the solution, because MTP resolves
      # --coverage-output relative to --results-directory: a single shared directory would let
      # parallel modules overwrite each other's Cobertura report. Each project therefore gets its
      # own results directory, and every report is merged afterwards.
      #
      # Those per-project results directories are also why the projects can run CONCURRENTLY: the
      # report collision was the only reason this loop was ever serial. Each project's output is
      # prefixed with its module name so interleaved logs stay attributable, and every background
      # PID is waited on individually so a failure in any project fails the step.
      #
      # XE-Local-AI-Engine.Tests is the exception: it does not run as one `dotnet test`, it runs
      # through scripts/run-tests-memory-safe.sh as one PROCESS per test namespace, JOBS at a time.
      # WHY: this module responds to process-level parallelism and barely at all to in-process
      # width, which is contention-bound behind the static HostStartupLock, a multi-GB heap and the
      # per-test web hosts. Measured 2026-08-22 on a 16-core box: one process 8-wide = 11:00,
      # JOBS=4 batches = 6:02, JOBS=10 batches = 2:18 — and in CI the same module took 22:31 on its
      # own at width 2. JOBS is therefore the runner's core count, not an in-process width, and each
      # batch writes its own Cobertura + TRX report under $COVERAGE_ROOT/<module>/<namespace>/.
      #
      # --maximum-parallel-tests caps the width of the remaining projects (TUnit's default is
      # ProcessorCount*4, which times out on shared runners). It is a flat 4: it used to be divided
      # by the project count to keep total in-flight tests near 8, which is pointless now that the
      # big module no longer competes for in-process width. TZ=Europe/Berlin exposes non-UTC
      # time-zone bugs (e.g. CapabilityReporterTests). global.json pins the
      # Microsoft.Testing.Platform runner.

      # Pre-pull the one image DockerSandboxRealDaemonTests uses, pinned by digest. Doing it here
      # means a registry blip fails THIS step as the infrastructure problem it is, instead of
      # surfacing as 22 test failures; the in-test pull then degrades to a local inspect.
      - name: Pre-pull the pinned sandbox test image
        run: docker pull alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce

      - name: Run backend tests with coverage (auto-enrolled)
        env:
          TZ: Europe/Berlin
          COVERAGE_ROOT: ${{ runner.temp }}/backend-coverage
          # Turns "no daemon / no image" from a silent skip into a failure, so the sandbox
          # hardening contract is actually verified by this gate. Deliberately no DOCKER_HOST:
          # ubuntu-latest's default rootful /var/run/docker.sock is the correct endpoint, and
          # setting it would send DockerDaemonEndpointResolver somewhere else.
          XE_REQUIRE_DOCKER_TESTS: "1"
        run: |
          set -euo pipefail
          mapfile -t test_projects < <(
            grep -oE 'Project Path="[^"]*"' XE-Local-AI-Engine.slnx \
              | sed -E 's/Project Path="([^"]*)"/\1/' \
              | grep -E '\.Tests(\.[A-Za-z0-9]+)*\.csproj$' \
              | grep -v 'E2ETests' \
              | sort)
          if [[ "${#test_projects[@]}" -eq 0 ]]; then
            echo "ERROR: zero test projects discovered in XE-Local-AI-Engine.slnx." >&2
            exit 1
          fi
          printf 'Enrolled test project: %s\n' "${test_projects[@]}"

          parallel_tests=4

          run_project() {
            local project="$1" module="$2"
            dotnet test "$project" --configuration Release --no-build \
              --maximum-parallel-tests "$parallel_tests" \
              --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura \
              --report-trx \
              --results-directory "$COVERAGE_ROOT/$module" \
              2>&1 | tee "$COVERAGE_ROOT-$module.log" | sed "s/^/[$module] /"
            # Hollow-gate guard: MTP always emits a "Passed!" or "Failed!" summary per suite that
            # ran. A suite that enrolled nothing prints no summary and still exits 0 — this catches
            # that silent green.
            if ! grep -qE 'Passed!|Failed!' "$COVERAGE_ROOT-$module.log"; then
              echo "ERROR: $module produced no test-suite summary — nothing ran." \
                   "Check project names or IsTestingPlatformApplication." >&2
              return 1
            fi
          }

          # The namespace-batched module. The script owns its own hollow-gate guarantee: a batch
          # that produced no MTP run summary is reported red there, so the per-module `Passed!|
          # Failed!` grep above is replaced by "the script exited 0 AND it emitted batch reports"
          # (asserted after the wait). NO_BUILD: the solution was already built in Release above.
          #
          # Disk it needs, measured locally 2026-08-22 for ~98 batches: ~3.9 GB of per-batch
          # Cobertura (the script already deletes the byte-identical TRX-attachment copies, which
          # would otherwise add ~3.4 GB more) plus one ~240 MB clone of the test output tree per
          # JOBS slot — coverage instrumentation rewrites assemblies in place, so concurrent batches
          # cannot share one tree. At nproc=4 that is ~1 GB of clones, ~5 GB in total. Dynamic
          # instrumentation would remove the clones but collects nothing for this host (evidence in
          # the script header); do not swap it in without re-measuring a non-empty report.
          run_batched() {
            local module="$1"
            NO_BUILD=1 JOBS="$(nproc)" COVERAGE_DIR="$COVERAGE_ROOT/$module" \
              scripts/run-tests-memory-safe.sh 2>&1 | sed "s/^/[$module] /"
          }

          batched_module=XE-Local-AI-Engine.Tests
          declare -A module_projects=()
          for project in "${test_projects[@]}"; do
            module_projects["$(basename "$project" .csproj)"]="$project"
          done
          if [[ -z "${module_projects[$batched_module]:-}" ]]; then
            echo "ERROR: $batched_module is not enrolled from the solution, so the namespace-batched" \
                 "path would silently never run. Rename batched_module here if the project moved." >&2
            exit 1
          fi

          declare -A test_pids=()
          for module in "${!module_projects[@]}"; do
            if [[ "$module" == "$batched_module" ]]; then
              run_batched "$module" &
            else
              run_project "${module_projects[$module]}" "$module" &
            fi
            test_pids["$module"]=$!
          done

          failed_modules=()
          for module in "${!test_pids[@]}"; do
            if ! wait "${test_pids[$module]}"; then
              failed_modules+=("$module")
            fi
          done
          if [[ "${#failed_modules[@]}" -gt 0 ]]; then
            echo "ERROR: test run failed for: ${failed_modules[*]}" >&2
            exit 1
          fi

          # Two depths, both bounded. A plain `dotnet test` project writes one report at
          # $COVERAGE_ROOT/<module>/coverage.cobertura.xml (depth 2); the batched module writes one
          # per namespace at $COVERAGE_ROOT/<module>/<namespace>/coverage.cobertura.xml (depth 3).
          # --report-trx also copies each report as a TRX attachment under
          # …/_<machine>_<timestamp>/In/<machine>/ (depth 5 for a sibling, 6 for a batch), so the
          # maxdepth bound is what stops those byte-identical copies being counted a second time.
          # merge-cobertura.py unions by (filename, line), so N reports merge exactly as two do.
          mapfile -t sibling_reports < <(find "$COVERAGE_ROOT" -mindepth 2 -maxdepth 2 -type f -name 'coverage.cobertura.xml' | sort)
          mapfile -t batch_reports < <(find "$COVERAGE_ROOT/$batched_module" -mindepth 2 -maxdepth 2 -type f -name 'coverage.cobertura.xml' | sort)
          expected_siblings=$(( ${#module_projects[@]} - 1 ))
          if [[ "${#sibling_reports[@]}" -ne "$expected_siblings" ]]; then
            echo "ERROR: expected $expected_siblings sibling Cobertura reports, found ${#sibling_reports[@]}." >&2
            exit 1
          fi
          if [[ "${#batch_reports[@]}" -eq 0 ]]; then
            echo "ERROR: $batched_module produced no per-namespace Cobertura report — the batched" \
                 "run enrolled nothing." >&2
            exit 1
          fi
          echo "Merging ${#sibling_reports[@]} whole-module + ${#batch_reports[@]} batch Cobertura report(s)."
          python3 scripts/merge-cobertura.py \
            --minimum-file scripts/backend-coverage-baseline.txt \
            "${sibling_reports[@]}" "${batch_reports[@]}"

      - name: Upload backend coverage and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          # `**` spans any number of segments, so the TRX files are picked up at both depths: one
          # per whole-module project, and one per namespace batch a level deeper (~13 MB in total).
          # The batched module's Cobertura reports are deliberately NOT uploaded: they are ~40 MB
          # EACH (~3.9 GB for ~98 batches, since every report lists every source line of every
          # loaded assembly), and nothing downstream consumes them — the gate is the merged
          # percentage the step already printed. The sibling projects' single reports still are.
          path: |
            ${{ runner.temp }}/backend-coverage/**/*.xml
            ${{ runner.temp }}/backend-coverage/**/*.trx
            !${{ runner.temp }}/backend-coverage/XE-Local-AI-Engine.Tests/**/*.xml
          # warn, not error: a run that died before the first suite finished has nothing to upload,
          # and the test step already failed — a second red here would only add noise.
          if-no-files-found: warn

  client-react:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: XE-Local-AI-Engine.Client.React

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Setup .NET 8 runtime for pinned license tooling
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore pinned .NET license tools
        run: dotnet tool restore --tool-manifest ../dotnet-tools.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift gate: regenerate the hey-api client from the committed OpenAPI spec and fail if the
      # generated output differs from what is committed. Deterministic; needs no running host.
      - name: Check generated OpenAPI client is up to date
        run: pnpm run openapi:check

      # License-drift gate: fail the build if a production dependency's license is not on
      # the allowlist, or if the committed license manifest is stale. Same deterministic, host-free
      # pattern as the OpenAPI drift gate above. `pnpm run licenses:check` (not `pnpm licenses`,
      # which is the built-in report command) so the repo script is what runs.
      - name: Check dependency licenses
        run: pnpm run licenses:check

      # `validate` is a superset of `lint`: tsc --noEmit + biome + stylelint, then the knip
      # dead-code baseline, the SignalR proxy/hub-registration sync check (reads Program.cs from
      # this checkout — no running backend) and the dependency-cruiser baseline. All static.
      # `pnpm run spellCheck` is deliberately NOT here: it reports ~1.7k unknown words on the
      # current tree, so it is a dictionary task, not a gate.
      - name: Validate (lint, knip, SignalR proxy sync, dependency baseline)
        run: pnpm run validate

      - name: Test
        run: pnpm run test:coverage:check

      - name: Test build and compliance tooling
        run: pnpm run test:tooling

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        # high/critical block the build; moderate/low are advisory-only and must not red an unrelated PR.
        run: pnpm audit --prod --audit-level=high
