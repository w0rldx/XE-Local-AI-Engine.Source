name: build-and-test

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  # Reusable entrypoint: the release workflow calls this file so the exact
  # tagged commit re-runs these gates before any package is published. No
  # inputs/secrets are needed — every job here is self-contained and only
  # reads the repo (permissions: contents: read), so the caller need not
  # pass `secrets: inherit`.
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore pinned release tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Run auto-enrolled release contract tests
        run: scripts/run-release-contract-tests.sh

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore XE-Local-AI-Engine.slnx

      - name: Build solution
        run: dotnet build XE-Local-AI-Engine.slnx --configuration Release --no-restore

      - name: Setup pnpm for live OpenAPI verification
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js for live OpenAPI verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Install frontend dependencies for live OpenAPI verification
        working-directory: XE-Local-AI-Engine.Client.React
        run: pnpm install --frozen-lockfile

      - name: Compare live backend OpenAPI with committed frontend contract
        run: scripts/openapi-live-check.sh

      # Auto-enrolling backend test run: `dotnet test` on the solution runs EVERY MTP test project
      # (name ends with .Tests / contains .Tests.) so new suites need no workflow edit. E2E is excluded
      # by default (its csproj sets IsTestingPlatformApplication=false unless RunE2ETests=true, so the
      # MTP runner does not collect it); it needs Playwright browsers + builds the SPA, so it runs in the
      # dedicated e2e workflow. --max-parallel-test-modules 1 keeps suites sequential (concurrent runs
      # time out on shared runners). TZ=Europe/Berlin exposes non-UTC time-zone bugs (e.g.
      # CapabilityReporterTests). global.json pins the Microsoft.Testing.Platform runner for dotnet test.
      - name: Run backend tests (auto-enrolled)
        env:
          TZ: Europe/Berlin
        run: |
          set -o pipefail
          dotnet test XE-Local-AI-Engine.slnx --configuration Release --no-build --max-parallel-test-modules 1 \
            | tee /tmp/xe-test-output.txt
          # Hollow-gate guard: MTP always emits a "Passed!" or "Failed!" summary per suite that ran.
          # If zero suites are enrolled (e.g. misnamed project, MTP not collected), the output has
          # no summary line and dotnet exits 0 — this check catches that silent green.
          if ! grep -qE 'Passed!|Failed!' /tmp/xe-test-output.txt; then
            echo "ERROR: no test-suite summary found — zero test projects enrolled." \
                 "Check project names or IsTestingPlatformApplication." >&2
            exit 1
          fi

  client-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XE-Local-AI-Engine.Client.React

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # pnpm version is pinned via `packageManager` in the React subdir, not the (absent) repo-root package.json.
          package_json_file: XE-Local-AI-Engine.Client.React/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: XE-Local-AI-Engine.Client.React/pnpm-lock.yaml

      - name: Setup .NET 8 runtime for pinned license tooling
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore pinned .NET license tools
        run: dotnet tool restore --tool-manifest ../dotnet-tools.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift gate: regenerate the hey-api client from the committed OpenAPI spec and fail if the
      # generated output differs from what is committed. Deterministic; needs no running host.
      - name: Check generated OpenAPI client is up to date
        run: pnpm run openapi:check

      # License-drift gate: fail the build if a production dependency's license is not on
      # the allowlist, or if the committed license manifest is stale. Same deterministic, host-free
      # pattern as the OpenAPI drift gate above. `pnpm run licenses:check` (not `pnpm licenses`,
      # which is the built-in report command) so the repo script is what runs.
      - name: Check dependency licenses
        run: pnpm run licenses:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage:check

      - name: Test build and compliance tooling
        run: pnpm run test:tooling

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        # high/critical block the build; moderate/low are advisory-only and must not red an unrelated PR.
        run: pnpm audit --prod --audit-level=high
