version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 3
    # The repo targets net10.0: a major of these families is the next .NET line (a TFM/SDK migration, not a bump), and
    # Microsoft.Extensions.AI 11.x needs the 11.x abstractions, which the 10.0.x pins refuse (NU1109).
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # The framework-versioned System.* packages by name: System.CommandLine has its own major line.
      - dependency-name: "System.Numerics.Tensors"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.ProtectedData"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry.Api 1.21.0's net10.0 dependency group requires System.Diagnostics.DiagnosticSource >= 11.0.0, a
      # .NET 11 package that would replace the shared framework's copy; revisit when the repo moves to .NET 11.
      - dependency-name: "OpenTelemetry*"
        versions: [">= 1.21.0"]
    groups:
      aspire-coupled:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
      agent-ai-coupled:
        patterns:
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"
      # ModelContextProtocol.AspNetCore takes an exact dependency on the matching
      # ModelContextProtocol build, so a split bump fails restore under transitive
      # pinning (NU1107/NU1608). They only ever move as a pair.
      mcp-coupled:
        patterns:
          - "ModelContextProtocol"
          - "ModelContextProtocol.*"
      nuget-remaining:
        patterns:
          - "*"
        exclude-patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"
          - "ModelContextProtocol"
          - "ModelContextProtocol.*"

  # The shipped training runtime (ADR 0005): unsloth caps transformers/torch, so every PR from
  # here must pass a `uv lock` sanity check before merge. See tools/training/pyproject.toml header.
  - package-ecosystem: uv
    directory: /tools/training
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 1
    # torch and torchvision are a hand-pinned pair from the cu129 index: torchvision follows torch.
    # With target-branch set, ignore applies to version updates only; security updates still open PRs.
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision

  # The shipped run_python environment (ComputePythonEnvironment builds it from this lock).
  - package-ecosystem: uv
    directory: /tools/compute
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 1

  # Repository Python tooling (the root uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 1
    # CPU torch for the Model Lab lens test is pinned by hand to the training lock's version.
    ignore:
      - dependency-name: torch

  - package-ecosystem: npm
    directory: /XE-Local-AI-Engine.Client.React
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7"
    groups:
      frontend-runtime:
        dependency-type: production
        patterns:
          - "*"
      frontend-openapi-codegen:
        dependency-type: development
        patterns:
          - "@hey-api/openapi-ts"
          - "typescript"
      frontend-type-definitions:
        dependency-type: development
        patterns:
          - "@types/*"
      frontend-development-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@hey-api/openapi-ts"
          - "typescript"
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions-weekly:
        patterns:
          - "*"
