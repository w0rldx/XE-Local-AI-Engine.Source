version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      aspire-coupled:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
      agent-ai-coupled:
        patterns:
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"
      # ModelContextProtocol.AspNetCore takes an exact dependency on the matching
      # ModelContextProtocol build, so a split bump fails restore under transitive
      # pinning (NU1107/NU1608). They only ever move as a pair.
      mcp-coupled:
        patterns:
          - "ModelContextProtocol"
          - "ModelContextProtocol.*"
      nuget-remaining:
        patterns:
          - "*"
        exclude-patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"
          - "ModelContextProtocol"
          - "ModelContextProtocol.*"

  # The shipped training runtime (ADR 0005): unsloth caps transformers/torch, so every PR from
  # here must pass a `uv lock` sanity check before merge. See tools/training/pyproject.toml header.
  - package-ecosystem: uv
    directory: /tools/training
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /XE-Local-AI-Engine.Client.React
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7"
      # Keep the type surface aligned with the supported Node 22 runtime until that baseline moves.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-runtime:
        dependency-type: production
        patterns:
          - "*"
      frontend-openapi-codegen:
        dependency-type: development
        patterns:
          - "@hey-api/openapi-ts"
          - "typescript"
      frontend-type-definitions:
        dependency-type: development
        patterns:
          - "@types/*"
      frontend-development-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@hey-api/openapi-ts"
          - "typescript"
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions-weekly:
        patterns:
          - "*"
