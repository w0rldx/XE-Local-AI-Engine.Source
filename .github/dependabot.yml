version: 2
# PAUSED for the v1.0.0-rc.1 release: open-pull-requests-limit is 0 on every ecosystem so no new
# version-update PRs are opened while develop is frozen at the verified release commit. Restore the
# prior limits (nuget 3, npm 3, github-actions 2) after the RC is published.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 0
    groups:
      aspire-coupled:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
      agent-ai-coupled:
        patterns:
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"
      nuget-remaining:
        patterns:
          - "*"
        exclude-patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"

  - package-ecosystem: npm
    directory: /XE-Local-AI-Engine.Client.React
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 0
    groups:
      npm-weekly:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 0
    groups:
      actions-weekly:
        patterns:
          - "*"
