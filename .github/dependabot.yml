version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      aspire-coupled:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
      agent-ai-coupled:
        patterns:
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"
      nuget-remaining:
        patterns:
          - "*"
        exclude-patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
          - "Microsoft.Agents.*"
          - "Microsoft.Extensions.AI*"

  - package-ecosystem: npm
    directory: /XE-Local-AI-Engine.Client.React
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      frontend-runtime:
        dependency-type: production
        patterns:
          - "*"
      frontend-openapi-codegen:
        dependency-type: development
        patterns:
          - "@hey-api/openapi-ts"
          - "typescript"
      frontend-type-definitions:
        dependency-type: development
        patterns:
          - "@types/*"
      frontend-development-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@hey-api/openapi-ts"
          - "typescript"
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions-weekly:
        patterns:
          - "*"
