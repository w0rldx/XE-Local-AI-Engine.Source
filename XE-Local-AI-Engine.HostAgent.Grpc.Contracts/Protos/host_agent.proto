syntax = "proto3";

package xe.hostagent.v1;

option csharp_namespace = "XE_Local_AI_Engine.HostAgent.Grpc.Contracts";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service HostAgentControl {
  rpc GetStatus(google.protobuf.Empty) returns (HostAgentStatusReply);
  rpc GetCapabilities(google.protobuf.Empty) returns (HostCapabilitiesReply);
  rpc ListContainers(google.protobuf.Empty) returns (ListContainersReply);
  rpc StartAllContainers(AllContainersActionRequest) returns (ContainerActionReply);
  rpc StopAllContainers(AllContainersActionRequest) returns (ContainerActionReply);
  rpc StartContainer(ContainerActionRequest) returns (ContainerActionReply);
  rpc StopContainer(ContainerActionRequest) returns (ContainerActionReply);
  rpc RestartContainer(ContainerActionRequest) returns (ContainerActionReply);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogEntryReply);
}

message HostAgentStatusReply {
  HostAgentState state = 1;
  HostAgentDesiredState desired_state = 2;
  RuntimeLifecycle runtime_lifecycle = 3;
  bool bootstrap_model_ready = 4;
  string web_ui_url = 5;
  google.protobuf.Timestamp observed_at = 6;
  repeated RuntimeComponentStatusReply components = 7;
  repeated string diagnostics = 8;
}

message HostCapabilitiesReply {
  bool cpu_available = 1;
  bool nvidia_gpu_inference = 2;
  bool gpu_runtime_configured = 3;
  string amd_gpu_status = 4;
  int64 runtime_disk_bytes = 5;
  google.protobuf.Timestamp observed_at = 6;
  repeated string diagnostics = 7;
}

message RuntimeComponentStatusReply {
  string name = 1;
  ContainerDesiredState desired_state = 2;
  ContainerHealth health = 3;
  string image_reference = 4;
  bool digest_verified = 5;
  google.protobuf.Timestamp observed_at = 6;
  repeated string diagnostics = 7;
}

message ListContainersReply {
  repeated RuntimeComponentStatusReply containers = 1;
}

message ContainerActionRequest {
  string container_name = 1;
  int32 drain_timeout_seconds = 2;
}

message AllContainersActionRequest {
  int32 drain_timeout_seconds = 1;
}

message ContainerActionReply {
  string action = 1;
  bool succeeded = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp completed_at = 4;
  repeated RuntimeComponentStatusReply components = 5;
  repeated string diagnostics = 6;
}

message StreamLogsRequest {
  string container_name = 1;
  int32 tail_lines = 2;
  bool follow = 3;
}

message LogEntryReply {
  string container_name = 1;
  string stream = 2;
  string line = 3;
  google.protobuf.Timestamp observed_at = 4;
}

enum HostAgentState {
  HOST_AGENT_STATE_UNSPECIFIED = 0;
  HOST_AGENT_STATE_STARTING = 1;
  HOST_AGENT_STATE_RUNNING = 2;
  HOST_AGENT_STATE_DEGRADED = 3;
  HOST_AGENT_STATE_STOPPING = 4;
  HOST_AGENT_STATE_STOPPED = 5;
  HOST_AGENT_STATE_FAILED = 6;
}

enum HostAgentDesiredState {
  HOST_AGENT_DESIRED_STATE_UNSPECIFIED = 0;
  HOST_AGENT_DESIRED_STATE_RUNNING = 1;
  HOST_AGENT_DESIRED_STATE_STOPPED = 2;
}

enum RuntimeLifecycle {
  RUNTIME_LIFECYCLE_UNSPECIFIED = 0;
  RUNTIME_LIFECYCLE_MANAGED = 1;
  RUNTIME_LIFECYCLE_NATIVE = 2;
  RUNTIME_LIFECYCLE_EXTERNAL = 3;
}

enum ContainerDesiredState {
  CONTAINER_DESIRED_STATE_UNSPECIFIED = 0;
  CONTAINER_DESIRED_STATE_RUNNING = 1;
  CONTAINER_DESIRED_STATE_STOPPED = 2;
}

enum ContainerHealth {
  CONTAINER_HEALTH_UNSPECIFIED = 0;
  CONTAINER_HEALTH_STARTING = 1;
  CONTAINER_HEALTH_HEALTHY = 2;
  CONTAINER_HEALTH_UNHEALTHY = 3;
  CONTAINER_HEALTH_STOPPED = 4;
}

// AgentHome sandbox lifecycle + IO (local-container sandbox). A separate service from HostAgentControl
// (lifecycle vs sandbox), served by the same HostAgent.Linux gRPC server, so the global HMAC
// interceptor authenticates every call. ALL rpcs are UNARY by design: the interceptor only
// overrides the unary and server-streaming handlers, so a client-/bidi-streaming rpc would
// silently bypass HMAC. The messages map 1:1 onto the ISandboxRuntimeProvider SPI DTOs so the
// LocalContainerSandboxProvider stays a thin translator.
service SandboxControl {
  rpc CreateOrAttachSandbox (CreateSandboxRequest) returns (SandboxHandleReply);
  rpc ConnectSandbox        (ConnectSandboxRequest) returns (SandboxHandleReply);
  rpc ExecuteCommand        (ExecuteCommandRequest) returns (ExecuteCommandReply);
  rpc CopyInto              (CopyIntoRequest)        returns (google.protobuf.Empty);
  rpc ReadFile              (ReadFileRequest)        returns (ReadFileReply);
  rpc CopyOut               (CopyOutRequest)         returns (ReadFileReply);
  rpc CancelCommand         (CancelCommandRequest)   returns (google.protobuf.Empty);
  rpc KillSandbox           (KillSandboxRequest)     returns (google.protobuf.Empty);
}

// Mirrors SandboxAttachKey. Owner/node-scoped identity validated against container labels on attach.
message SandboxAttachKeyMessage {
  string owner_user_id = 1;
  string node_id = 2;
  string provider_name = 3;
  string runtime_profile = 4;
  int32 manifest_version = 5;
}

// Provider-neutral network posture; mirrors SandboxNetworkPolicy.
enum SandboxNetworkMode {
  SANDBOX_NETWORK_MODE_NONE = 0;
  SANDBOX_NETWORK_MODE_RESTRICTED = 1;
}

// Mirrors SandboxResourceLimits. Every field is optional in the SPI; zero means "not specified".
message ResourceLimitsMessage {
  double cpu_count = 1;
  int32 memory_mb = 2;
  int32 pids_limit = 3;
}

// Mirrors SandboxCreateRequest. HostAgent finds-or-creates by deterministic name and validates labels.
message CreateSandboxRequest {
  SandboxAttachKeyMessage attach_key = 1;
  string runtime_profile = 2;
  string default_image = 3;
  ResourceLimitsMessage limits = 4;
  SandboxNetworkMode network = 5;
  map<string, string> labels = 6;
}

message ConnectSandboxRequest {
  SandboxAttachKeyMessage attach_key = 1;
}

// Mirrors SandboxHandle. provider_name is filled client-side by the local provider.
message SandboxHandleReply {
  string sandbox_id = 1;
  SandboxAttachKeyMessage attach_key = 2;
  google.protobuf.Timestamp created_at = 3;
  int32 manifest_version = 4;
}

// Mirrors SandboxCommandRequest. timeout_seconds <= 0 means no per-command timeout.
message ExecuteCommandRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  string executable = 3;
  repeated string arguments = 4;
  string working_directory = 5;
  map<string, string> environment = 6;
  int32 timeout_seconds = 7;
  bytes standard_input = 8;
}

// Mirrors SandboxCommandResult. stdout/stderr are strings to match the SPI; the --binary git
// patch is base85 ASCII, so capturing the diff as a string is lossless.
message ExecuteCommandReply {
  string execution_id = 1;
  int32 exit_code = 2;
  string standard_output = 3;
  string standard_error = 4;
  bool completed = 5;
  int64 duration_ms = 6;
}

// Copy-into carries BYTES, not host paths: the worker reads the host file and HostAgent only does
// container-internal IO (the F no-follow open stays in the trusted worker resolver). Whole-file.
message CopyIntoRequest {
  string sandbox_id = 1;
  string destination_path = 2;
  bytes content = 3;
  uint32 file_mode = 4;
}

message ReadFileRequest {
  string sandbox_id = 1;
  string sandbox_path = 2;
}

message CopyOutRequest {
  string sandbox_id = 1;
  string source_path = 2;
}

// BYTES so the provider decodes UTF-8 for ReadFileAsync and writes raw for CopyOutAsync (no lossage).
message ReadFileReply {
  bytes content = 1;
}

message CancelCommandRequest {
  string sandbox_id = 1;
  string execution_id = 2;
}

message KillSandboxRequest {
  string sandbox_id = 1;
}

// Narrow approved-image model-fit utility runner (llmfit recommend/benchmark, plan Marker 2). A THIRD unary service
// distinct from HostAgentControl/SandboxControl, served by the same HostAgent.Linux gRPC server so the global HMAC
// interceptor authenticates every call. The rpc is UNARY by design (the interceptor only covers unary/server-streaming
// handlers). This is NOT a general Docker executor: the request carries INTENT only (operation + validated params + a
// pinned image reference). There is deliberately NO command/argv/executable/image-name field — the HostAgent builds the
// llmfit argv from a fixed server-side command profile and re-validates the image reference against an allowlist.
service ModelFitUtilityControl {
  rpc RunModelFitUtility (RunModelFitUtilityRequest) returns (RunModelFitUtilityReply);
}

// Mirrors the Persistence ModelFitOperation. RECOMMEND is the primary path; BENCHMARK is built here but its
// endpoint/template exposure is gated to a later marker.
enum ModelFitOperationMessage {
  MODEL_FIT_OPERATION_UNSPECIFIED = 0;
  MODEL_FIT_OPERATION_RECOMMEND = 1;
  MODEL_FIT_OPERATION_BENCHMARK = 2;
}

// The container network posture for a utility run. NONE attaches no network (recommend is fully offline); RUNTIME
// attaches the managed runtime network so the provider DNS name (e.g. http://ollama:11434) resolves for benchmark.
enum ModelFitNetworkModeMessage {
  MODEL_FIT_NETWORK_MODE_NONE = 0;
  MODEL_FIT_NETWORK_MODE_RUNTIME = 1;
}

// Terminal status of a utility run. Mirrors the Persistence ModelFitRunStatus terminal states.
enum ModelFitTerminalStatusMessage {
  MODEL_FIT_TERMINAL_STATUS_UNSPECIFIED = 0;
  SUCCEEDED = 1;
  FAILED = 2;
  CANCELLED = 3;
  TIMED_OUT = 4;
}

// Intent-level request. The image reference is the pinned repo:tag@sha256 the node already validated; the HostAgent
// RE-validates it (defense in depth) and rejects anything not canonical/allowlisted before running.
message RunModelFitUtilityRequest {
  string image_reference = 1;            // pinned repo:tag@sha256 — HostAgent re-validates
  ModelFitOperationMessage operation = 2;
  string use_case = 3;                   // recommend only; HostAgent appends only if non-empty
  int32 limit = 4;                       // recommend only; >0
  string model_name = 5;                 // benchmark only (required for bench)
  string provider_name = 6;              // e.g. "ollama"
  string provider_url = 7;               // e.g. http://ollama:11434 (benchmark --url)
  ModelFitNetworkModeMessage network = 8;
  int32 cpu_cores_override = 9;          // 0 = unset
  int32 ram_override_gb = 10;            // 0 = unset
  int32 vram_override_gb = 11;           // 0 = unset
  int32 timeout_seconds = 12;            // <=0 => use HostAgent default max runtime
}

// Captured one-shot result. standard_output/standard_error carry the raw text over the trusted HMAC channel (the node
// stores them encrypted and sanitizes for the API). sanitized_error is an operator-safe one-liner that never carries
// secrets or raw stderr.
message RunModelFitUtilityReply {
  ModelFitTerminalStatusMessage status = 1;
  int32 exit_code = 2;
  string standard_output = 3;            // raw stdout (the JSON) — node treats as sensitive
  string standard_error = 4;             // raw stderr
  bool completed = 5;
  int64 duration_ms = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  string sanitized_error = 9;            // operator-safe one-liner, never secrets
}
