# Repo-wide Python quality tooling (ruff / pyrefly / pytest / bandit) — DEV ONLY.
#
# This is deliberately NOT tools/training/pyproject.toml. That file plus its uv.lock is the
# shipped training runtime manifest (ADR 0005): the app copies exactly those two files into
# staging and runs `uv sync --locked`, so anything added there lands in every user's training
# venv and forces a re-lock behind the live GPU gate. The tooling below therefore lives at the
# repo root with its own uv.lock, and only ever reads tools/training/*.py. On linux x86_64 it adds
# CPU torch (pinned by hand to the training lock's version) so the Model Lab lens test runs real
# tensor ops; the rest of the training stack stays out.
#
# Run it through scripts/python-validation.sh (see AGENTS.md); the CI `python-quality` job runs
# `--scope full`.

[project]
name = "xe-python-tooling"
version = "0.1.0"
description = "Lint, type-check, test and security-scan the repository's Python (the roots in scripts/python-validation.sh)."
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
    # CPU wheel for test_modellab_lens.py; the same version as tools/training/uv.lock, bumped by hand with it.
    # numpy too: without it `import torch` warns, and filterwarnings = error fails collection.
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
# Python files only: ruff >= 0.16 also formats Python fences inside *.md by default, which would
# rewrite agent-template markdown under Client.Application.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
line-length = 120
target-version = "py314"
# scripts/** run under the host's python3 (dev-start.sh, release.yml) and the embedded benchmark harness under the
# sandbox interpreter, not this venv: keep their syntax parseable on 3.13 (parenthesised multi-type except, PEP 758).
per-file-target-version = { "scripts/**" = "py313", "XE-Local-AI-Engine.Client.Application/Services/Benchmarks/PythonTests/**" = "py313" }
src = ["tools/training", "scripts", "catalog/external-apps/tools", "XE-Local-AI-Engine.Client.Application/Services/Benchmarks/PythonTests"]
extend-exclude = ["tools/training/.venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # imports
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # naming
    "S",   # security-ish rules
    "PT",  # flake8-pytest-style: fixture/parametrize/raises shape, and no assertion-less pytest.raises
]

[tool.ruff.lint.per-file-ignores]
# The tests under scripts/** are deliberately unittest.TestCase: every one of them also runs standalone
# under a bare `python3 <file>` via its `unittest.main()` tail, with no pytest on the path. PT009/PT027
# would rewrite exactly those self-assertions into bare `assert`/`pytest.raises`, which is why they are
# ignored here rather than applied. The rest of the PT family stays on everywhere.
"**/tests/**/*.py" = ["S101", "PT009", "PT027"]
# tools/training ships to the user's training venv (ADR 0005) and must not import pytest, so an expected
# error is asserted inside `except` (PT017) instead of through `pytest.raises`.
"tools/training/test_*.py" = ["S101", "PT017"]
# Repo automation under scripts/: subprocess with literal argv/executables and XML parsed from our
# own build outputs (cobertura, csproj, nuspec). Blanket-flagging every call there is noise, not
# a finding; the remaining S-rules (S310 urlopen, S105/S108, ...) stay on and are answered per call.
"scripts/**/*.py" = ["S603", "S607", "S314"]

[tool.pyrefly]
project-includes = ["tools/training", "scripts", "catalog/external-apps/tools", "XE-Local-AI-Engine.Client.Application/Services/Benchmarks/PythonTests"]
project-excludes = ["**/.venv", "**/node_modules", "**/__pycache__"]
search-path = ["tools/training", "scripts/compliance", "catalog/external-apps/tools"]
python-version = "3.14"
# The training scripts import the fine-tuning stack (torch/unsloth/transformers/trl/datasets),
# which only exists in full inside the 7 GB provisioned runtime venv. This dev venv has CPU torch
# for one test only, so torch stays Any here too, as on a platform without it. Those imports
# resolve to Any; everything pure-python (trainlib, exportlib, protocol code, scripts/**) is
# fully checked.
replace-imports-with-any = ["unsloth", "unsloth.*", "torch", "torch.*", "transformers", "transformers.*", "trl", "datasets"]

[tool.pytest.ini_options]
testpaths = [
    "tools/training",
    "scripts/tests",
    "scripts/compliance/tests",
    "scripts/performance/tests",
    "catalog/external-apps/tools/tests",
]
python_files = ["test_*.py", "*.test.py"]
# catalog/external-apps/tools so the converter tests can `import build_catalog` without a package.
pythonpath = ["tools/training", "catalog/external-apps/tools"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --cov=tools/training --cov=scripts --cov=catalog/external-apps/tools --cov-report=term-missing"
filterwarnings = [
    "error",
]

[tool.bandit]
# Each entry is both a glob and a plain substring of the path, so a bare "tests" would also drop
# xe-pythontests-*.py; "*/tests/*" matches only a tests directory.
exclude_dirs = ["*/tests/*", ".venv", "node_modules"]
# B101 (assert) as in the house setup; the subprocess/xml blacklist entries mirror the ruff
# per-file policy for scripts/** above (bandit has no per-path ignore).
skips = ["B101", "B404", "B603", "B607", "B314", "B405"]
