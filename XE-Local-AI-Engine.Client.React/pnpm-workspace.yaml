minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade

overrides:
  # Security patches for vulnerable transitive copies pulled by Hey API and Monaco Editor.
  'js-yaml@<4.3.2': '4.3.2'
  # dompurify GHSA-cg2g-xh64-v4q7 (critical) and GHSA-mrv2-3pqr-j5jr (high) cover <=3.4.16; 3.4.17 is the fixed patch.
  'dompurify@<3.4.17': '3.4.17'
  # source-map-js (via postcss) GHSA-68fv-2mgg-jv7q covers >=1.0.0 <1.2.2; 1.2.2 is the fixed patch.
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  # minimatch (dev-only, via eslint under react-doctor) GHSA-g3hv-75wg-m249 covers >=7.0.0 <11.0.1 and no eslint release
  # accepts minimatch 11 yet (eslint 10.14.0 asks ^10.2.6); 11.0.3 is the newest fixed patch past the release-age hold.
  'minimatch@>=7.0.0 <11.0.1': '11.0.3'
  # fast-uri GHSA-hrr3-gc8f-f4qj, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h and GHSA-333x-w4r6-6crp
  # cover <3.1.9 (dev-only, via ajv under stylelint and react-doctor); 3.1.9 is the fixed patch.
  'fast-uri@<3.1.9': '3.1.9'
  # follow-redirects (prod, via axios) GHSA-mrwp-f3q8-3g9p covers >=1.16.0 <=1.16.1; 1.16.2 is the fixed patch.
  'follow-redirects@>=1.16.0 <1.16.2': '1.16.2'

allowBuilds:
  msgpackr-extract: true
  # msw's postinstall only copies its browser service worker (mockServiceWorker.js) into public/. The suite
  # uses msw/node (setupServer) exclusively, so the script has nothing to contribute here.
  msw: false

trustPolicyExclude:
  - 'semver@6.3.1'

minimumReleaseAgeExclude:
  # Security patch for the fast-uri advisories above; wanted fresh, so exempt from the 7-day maturity hold.
  - 'fast-uri@3.1.9'
  # Security patch for the follow-redirects advisory above; published inside the 7-day hold.
  - 'follow-redirects@1.16.2'
