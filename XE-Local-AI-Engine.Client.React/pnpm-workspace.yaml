minimumReleaseAge: 10080
trustPolicy: no-downgrade

overrides:
  # Transformers 3.8.1 still allows only sharp 0.34.x, but every sharp <0.35.0 is affected by
  # GHSA-f88m-g3jw-g9cj. Keep the runtime dependency stable and pin the patched transitive version.
  '@huggingface/transformers@3.8.1>sharp': 0.35.3

allowBuilds:
  msgpackr-extract: true
  # Node-only / native build scripts pulled transitively by kokoro-js → @huggingface/transformers. The browser TTS
  # runtime uses onnxruntime-WEB (prebuilt wasm), never these; keep them unbuilt so install runs no native scripts.
  onnxruntime-node: false
  protobufjs: false
  sharp: false

trustPolicyExclude:
  - 'semver@6.3.1'

minimumReleaseAgeExclude:
  - '@xyflow/react@12.11.0'
  - '@xyflow/system@0.0.77'
  - '@mantine/colors-generator@9.3.0'
  - '@mantine/core@9.3.0'
  - '@mantine/hooks@9.3.0'
  - '@mantine/notifications@9.3.0'
  - '@mantine/store@9.3.0'
  - '@tanstack/form-core@1.32.1'
  - '@tanstack/form-devtools@0.2.28'
  - '@tanstack/query-core@5.100.14'
  - '@tanstack/query-devtools@5.100.14'
  - '@tanstack/react-form-devtools@0.2.28'
  - '@tanstack/react-form@1.32.1'
  - '@tanstack/react-query-devtools@5.100.14'
  - '@tanstack/react-query@5.100.14'
  - '@tanstack/router-core@1.171.6'
  - '@tanstack/router-generator@1.167.10'
  - '@tanstack/router-plugin@1.168.11'
  - '@tanstack/router-utils@1.162.1'
  - '@vitest/coverage-v8@4.1.7'
  - '@vitest/expect@4.1.7'
  - '@vitest/mocker@4.1.7'
  - '@vitest/pretty-format@4.1.7'
  - '@vitest/runner@4.1.7'
  - '@vitest/snapshot@4.1.7'
  - '@vitest/spy@4.1.7'
  - '@vitest/ui@4.1.7'
  - '@vitest/utils@4.1.7'
  - vitest@4.1.7
