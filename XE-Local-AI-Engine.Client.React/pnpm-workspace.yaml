minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade

overrides:
  # Security patches for vulnerable transitive copies pulled by Hey API and Monaco Editor.
  'js-yaml@<4.3.2': '4.3.2'
  # dompurify advisory covers >=3.4.13 <=3.4.15; 3.4.16 is the fixed patch.
  'dompurify@<3.4.16': '3.4.16'
  # vitest 5 needs why-is-node-running ^3.2.1; 3.2.2 dropped npm provenance, which trustPolicy no-downgrade refuses.
  # Pinned to the attested 3.2.1. Drop once a provenance-attested 3.2.x above 3.2.1 is published.
  'why-is-node-running@3': '3.2.1'
  # source-map-js (via postcss) GHSA-68fv-2mgg-jv7q covers >=1.0.0 <1.2.2; 1.2.2 is the fixed patch.
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'

allowBuilds:
  msgpackr-extract: true
  # msw's postinstall only copies its browser service worker (mockServiceWorker.js) into public/. The suite
  # uses msw/node (setupServer) exclusively, so the script has nothing to contribute here.
  msw: false

trustPolicyExclude:
  - 'semver@6.3.1'

minimumReleaseAgeExclude:
  # Security patch for GHSA-68fv-2mgg-jv7q, exempt from the 7-day hold; removable once past it (2026-10-07).
  - 'source-map-js@1.2.2'
